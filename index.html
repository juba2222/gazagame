<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>هل ستنجو؟ / Will You Survive?</title>
  <meta name="description" content="محاكاة تجربة مدني غزي خلال الحرب — A simulation of a Gazan civilian's experience during the war" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ======== PHASER CANVAS CONTAINER ======== -->
  <div id="game-container">

    <!-- ======== SETUP OVERLAY (DOM, shown before game start) ======== -->
    <div id="setup-overlay">
      <!-- Populated by SetupScene.js -->
    </div>

    <!-- ======== IN-GAME HUD (DOM overlay on top of canvas) ======== -->
    <div id="hud-overlay" class="hidden">
      <!-- Financial panel top-right (populated by GameScene) -->
      <div id="hud-resources" style="position:absolute;top:10px;right:10px;z-index:100;pointer-events:none;"></div>

      <!-- Family panel top-left (populated by GameScene) -->
      <div id="hud-family" style="position:absolute;top:10px;left:10px;z-index:100;pointer-events:none;"></div>
    </div>

    <!-- ======== EVENT OVERLAY (shown during events) ======== -->
    <div id="event-overlay" class="hidden">
      <!-- Populated by GameScene.js -->
    </div>

    <!-- ======== CONSEQUENCE TOAST ======== -->
    <div id="consequence-toast" class="hidden"></div>

    <!-- ======== DEATH OVERLAY ======== -->
    <div id="death-overlay" class="hidden">
      <!-- Populated by DeathScene.js -->
    </div>

    <!-- ======== END SCENE OVERLAY ======== -->
    <div id="end-overlay" class="hidden">
      <!-- Populated by EndScene.js -->
    </div>

  </div><!-- /#game-container -->

  <!-- ======== SCRIPTS ======== -->

  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game modules (order matters) -->
  <script src="js/i18n.js"></script>
  <script src="js/family.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/monthly_challenges.js"></script>
  <script src="js/events.js"></script>

  <!-- Phaser Scenes -->
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/SetupScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/EventScene.js"></script>
  <script src="js/scenes/DeathScene.js"></script>
  <script src="js/scenes/EndScene.js"></script>

  <!-- Main entry point -->
  <script src="js/main.js"></script>
</body>
</html>
